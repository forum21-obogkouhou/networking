<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>委員会懇親会管理</title><meta name="theme-color" content="#173b61"><meta name="description" content="委員会の懇親会を日程調整から精算まで一元管理"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#1c3048;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;line-height:1.6}header{background:linear-gradient(110deg,#173b61,#22587e);color:white;padding:24px max(20px,calc((100vw - 1180px)/2))}header h1{font-size:clamp(21px,2.2vw,28px);letter-spacing:.01em;margin:0}header h1 small{font-size:12px;background:#ffffff24;border:1px solid #ffffff35;padding:3px 9px;border-radius:20px;vertical-align:middle}header>small{color:#d5e7f6;font-size:13px}main{max-width:1180px;margin:0 auto;padding:24px 20px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;padding:5px;background:white;border:1px solid #e3e9f0;border-radius:16px;box-shadow:0 3px 12px #102a4310}nav button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:11px;color:#496179;padding:11px 9px;font-size:13px}nav button.active{background:#1e638e;color:white;box-shadow:0 3px 8px #184e7828}button,.btn{font:inherit;border:1px solid #d4e0e9;border-radius:10px;padding:10px 14px;background:white;color:#205679;cursor:pointer;font-weight:650;transition:background .15s}button:hover{background:#eaf3fa}button.primary,button.active{background:#1c6c9b;color:white;border-color:#1c6c9b}button.primary:hover{background:#15557c}button.danger{color:#aa3343}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #78bde7;outline-offset:2px}.welcome{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:25px 28px;background:linear-gradient(120deg,#e6f1f8,#f6fbff);border:1px solid #d8e8f2;border-radius:18px;margin-bottom:18px}.welcome h2{font-size:clamp(19px,2.2vw,25px);margin:7px 0}.welcome p{color:#536c82;margin:0;font-size:14px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.05em;color:#236f99}.panel{background:white;border:1px solid #e2e9f0;border-radius:16px;padding:22px;margin-bottom:17px;box-shadow:0 5px 22px #203d5709}h2{font-size:19px;margin:0 0 15px;letter-spacing:-.02em}h3{font-size:16px;margin:18px 0 8px}.heading-note{font-size:12px;font-weight:500;color:#73899a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:13px}.metric{background:#fff;border:1px solid #e0eaf1;border-radius:15px;padding:17px 18px;font-size:13px;color:#597188;box-shadow:0 2px 12px #152e4206}.metric b{display:block;font-size:clamp(21px,2.1vw,27px);color:#183e61;margin-top:8px;letter-spacing:-.04em}.muted{color:#687f93;font-size:13px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd9e5;border-radius:10px;padding:11px 12px;background:#fff;font:inherit;font-size:15px;color:#263d52}textarea{min-height:86px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e8eef4;vertical-align:middle}th{background:#f4f8fb;color:#516a80;font-weight:700}.scroll{overflow-x:auto;border:1px solid #e5ecf2;border-radius:11px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.warn{color:#a45c1b}.good{color:#18754a}.pill{display:inline-block;background:#e9f2f9;color:#285b7e;border-radius:99px;padding:4px 11px;font-size:12px}a{color:#156b9b}details{margin:8px 0}.hidden{display:none}footer{padding:25px 4px;color:#8191a1;text-align:center;font-size:12px}@media(min-width:800px){nav{position:sticky;top:8px;z-index:5}#app>.grid:first-child{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){header{padding:22px 18px}main{padding:14px 12px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:16px}nav button{white-space:normal;font-size:12px;min-height:48px;padding:7px 4px}.welcome{padding:18px;display:block}.welcome button{margin-top:15px;width:100%}.panel{padding:17px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px 12px;font-size:12px}.metric b{font-size:21px;overflow-wrap:anywhere}input,select,textarea{min-width:0}.panel>.grid{grid-template-columns:1fr}.actions button{flex:1 1 140px}table{min-width:550px}th,td{padding:9px}h2{font-size:18px}}@media(max-width:370px){nav{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>委員会懇親会管理 <small>Ver.1.1</small></h1><small>日程調整から精算まで、ひとつに。</small></header><main><nav id="nav" aria-label="メインメニュー"></nav><div id="app"></div><footer>委員会懇親会管理 · データはこの端末内に保存されます。定期的にバックアップしてください。</footer></main><script>
'use strict';const KEY='konshinkai_v1';const yen=n=>(Number(n)||0).toLocaleString('ja-JP')+'円';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const currentFY=()=>{let d=new Date();return d.getFullYear()-(d.getMonth()<9?1:0)};function seed(y){return {year:y,budget:0,events:Array.from({length:12},(_,i)=>({id:uid(),month:(i+9)%12+1,year:y+(i>=3?1:0),type:i%2?'幹事委員':'全体委員',date:'',time:'19:00',status:'準備前',allocation:0,venueId:'',scheduleUrl:'',deadline:'',reservation:'',cancelDeadline:'',memo:'',attendees:{},cost:0,paidBy:'',paymentDate:'',receiptName:'',receiptData:'',claimDate:'',claimAmount:null,settledDate:'',sent:[]})),members:[],venues:[]}}let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.events))db=seed(currentFY());if(!db.fiscalVersion){
 const oldPattern=db.events.length===12 && db.events[0].month===4 && db.events[3].month===7;
 if(oldPattern){
   const active=db.events.some(e=>e.date||e.scheduleUrl||e.venueId||e.cost||e.paymentDate||Object.keys(e.attendees||{}).length);
   if(!active){db.events.forEach((e,i)=>{e.month=(i+9)%12+1;e.year=db.year+(i>=3?1:0)});}
   else {db.migrationNotice='以前の4月始まりの開催データが残っています。既存の入力を守るため自動変更していません。バックアップ後に確認してください。';}
 }
 db.fiscalVersion='oct-sep';try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
}
let page='home',selected=db.events[0]?.id;function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('保存できません。領収書画像が大きすぎる可能性があります。JSONバックアップを作成してください。');return false}}function update(fn){fn();save();render()}const $=id=>document.getElementById(id);const event=()=>db.events.find(e=>e.id===selected)||db.events[0];const people=e=>db.members.filter(m=>m.active!==false&&(e.type==='全体委員'||m.executive));const joined=e=>Object.entries(e.attendees||{}).filter(([id,s])=>s==='参加').map(([id])=>db.members.find(m=>m.id===id)).filter(Boolean);const fee=e=>Math.max(0,(+e.cost||0)-(+e.allocation||0));const memberSum=e=>Object.values(e.fees||{}).reduce((a,b)=>a+(+b||0),0);const office=e=>Math.max(0,(+e.cost||0)-memberSum(e));const spent=()=>db.events.reduce((a,e)=>a+office(e),0);const alloc=()=>db.events.reduce((a,e)=>a+(+e.allocation||0),0);const field=(label,id,value,type='text')=>`<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`;const select=(label,id,opts,value)=>`<div><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;const link=u=>/^https:\/\//i.test(u||'')?`<a target="_blank" rel="noopener noreferrer" href="${esc(u)}">開く ↗</a>`:'未登録';function render(){const pages=[['home','ホーム'],['events','開催管理'],['members','委員名簿'],['venues','店舗台帳'],['finance','年間予算・精算'],['settings','設定・引継ぎ']];$('nav').innerHTML=pages.map(([k,v])=>`<button aria-current="${page===k?'page':'false'}" class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('app').innerHTML=({home:home,events:events,members:members,venues:venues,finance:finance,settings:settings})[page]()}function go(p){page=p;render()}function home(){let e=db.events.filter(x=>!x.settledDate)[0]||db.events[0];return `<section class="welcome"><div><span class="eyebrow">${db.year}年度 · ${db.year}年10月〜${db.year+1}年9月</span><h2>懇親会の運営を、もっとスムーズに。</h2><p>次にやることから始めましょう。初めての方は「設定・引継ぎ」で年間予算を登録してください。</p></div><button class="primary" onclick="go('settings')">年度・予算を設定 →</button></section>${db.migrationNotice?`<section class="panel warn">${esc(db.migrationNotice)}</section>`:''}<div class="grid"><div class="metric">年間予算<b>${yen(db.budget)}</b></div><div class="metric">事務局負担実績・見込<b>${yen(spent())}</b></div><div class="metric">予算残額（実績・見込差引）<b>${yen(db.budget-spent())}</b></div><div class="metric">配分未設定・未配分額<b>${yen(db.budget-alloc())}</b></div></div><section class="panel" style="margin-top:15px"><h2>次の開催 <span class="heading-note">まずはこちら</span></h2><p><b>${esc(e.year)}年${esc(e.month)}月　${esc(e.type)}</b>　<span class="pill">${esc(e.status)}</span></p><p class="muted">${esc(e.date||'開催日未確定')}　${esc(e.time)}</p><button class="primary" onclick="selected='${e.id}';go('events')">開催詳細へ</button></section><section class="panel"><h2>やることリスト</h2>${db.events.filter(e=>!e.settledDate).slice(0,6).map(e=>`<p>・${e.year}/${e.month} ${esc(e.type)}：${!e.scheduleUrl?'日程調整URL登録':!e.date?'日程確定':!e.venueId?'店舗予約':!e.paymentDate?'開催・支払記録':!e.claimDate?'事務局への請求':'精算完了確認'}</p>`).join('')}</section>`}function events(){let e=event();return `<section class="panel"><h2>開催管理</h2><div class="grid"><div><label>対象の開催</label><select id="eventChoice" onchange="selected=this.value;render()">${db.events.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${x.year}年${x.month}月 ${x.type}</option>`).join('')}</select></div></div><div class="grid">${select('進捗','status',['準備前','日程調整中','日程確定','予約済み','開催確定','開催済み','精算完了'],e.status)}${field('開催日','date',e.date,'date')}${field('開始時刻','time',e.time,'time')}${field('今回の事務局配分額（円）','allocation',e.allocation,'number')}${field('調整さんURL','scheduleUrl',e.scheduleUrl,'url')}${field('回答締切','deadline',e.deadline,'date')}${select('店舗','venueId',['未選択',...db.venues.map(v=>v.name)],db.venues.find(v=>v.id===e.venueId)?.name||'未選択')}${field('予約番号・予約名義','reservation',e.reservation)}${field('キャンセル期限','cancelDeadline',e.cancelDeadline,'date')}</div><label>メモ</label><textarea id="memo">${esc(e.memo)}</textarea><div class="actions"><button class="primary" onclick="saveEvent()">開催情報を保存</button><button onclick="window.open('https://chouseisan.com/','_blank','noopener')">調整さんを開く</button><span>${link(e.scheduleUrl)}</span></div></section><section class="panel"><h2>参加者・会費</h2><p class="muted">名簿で登録した委員を表示します。出欠確定後、必要に応じて個別会費を入力してください。</p><div class="scroll"><table><thead><tr><th>氏名</th><th>出欠</th><th>参加者負担（円）</th><th>徴収済</th></tr></thead><tbody>${people(e).map(m=>`<tr><td>${esc(m.name)}</td><td><select id="a_${m.id}">${['未回答','参加','欠席','未定'].map(s=>`<option ${((e.attendees||{})[m.id]||'未回答')===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input type="number" min="0" id="f_${m.id}" value="${(e.fees||{})[m.id]||0}"></td><td><input type="checkbox" id="c_${m.id}" ${(e.collected||{})[m.id]?'checked':''}></td></tr>`).join('')}</tbody></table></div><p>支出見込・実績：<b>${yen(e.cost)}</b> ／ 事務局配分：<b>${yen(e.allocation)}</b> ／ 超過額：<b>${yen(fee(e))}</b> ／ 参加者負担設定合計：<b>${yen(memberSum(e))}</b></p><div class="actions"><button onclick="splitFees()">超過額を参加予定者に均等割り</button><button class="primary" onclick="saveAttendance()">出欠・会費を保存</button></div></section><section class="panel"><h2>メール文面作成</h2><label>メール種別</label><select id="mailType" onchange="draftMail()"><option>日程調整依頼</option><option>未回答者への催促</option><option>開催案内</option><option>開催前リマインド</option><option>事務局への請求</option></select><label>宛先（コピーしてメールに貼り付け）</label><textarea id="mailTo" readonly></textarea><label>件名</label><input id="mailSubject"><label>本文</label><textarea id="mailBody" style="min-height:175px"></textarea><div class="actions"><button onclick="draftMail()">文面生成</button><button onclick="copyMail()">件名・本文をコピー</button><button onclick="openMail()">メールアプリを開く</button></div><p class="muted">送信はメールアプリで行います。このアプリは送信完了を自動検知しません。</p></section>`}function saveEvent(){let e=event(),v=$('venueId').value;let a=Number($('allocation').value);if(!Number.isFinite(a)||a<0){alert('配分額を確認してください');return}let newTotal=alloc()-(+e.allocation||0)+a;if(newTotal>+db.budget&&!confirm('配分合計が年間予算を超えます。保存しますか？'))return;update(()=>{for(let k of ['status','date','time','scheduleUrl','deadline','reservation','cancelDeadline','memo'])e[k]=$(k).value;e.allocation=a;e.venueId=db.venues.find(x=>x.name===v)?.id||''})}function saveAttendance(){let e=event();update(()=>{e.attendees=e.attendees||{};e.fees=e.fees||{};e.collected=e.collected||{};people(e).forEach(m=>{e.attendees[m.id]=$('a_'+m.id).value;e.fees[m.id]=Math.max(0,+$('f_'+m.id).value||0);e.collected[m.id]=$('c_'+m.id).checked})})}function splitFees(){let e=event(),ids=people(e).filter(m=>$('a_'+m.id).value==='参加');if(!ids.length){alert('参加予定者を選択してください');return}let x=fee(e),q=Math.floor(x/ids.length),r=x%ids.length;people(e).forEach(m=>{$('f_'+m.id).value=0});ids.forEach((m,i)=>{$('f_'+m.id).value=q+(i<r?1:0)});alert('会費を入力欄に配分しました。「出欠・会費を保存」で確定してください')}function draftMail(){let e=event(),v=db.venues.find(x=>x.id===e.venueId),type=$('mailType').value,ms=people(e),targets=type==='未回答者への催促'?ms.filter(m=>!e.attendees?.[m.id]||e.attendees[m.id]==='未回答'):type==='開催案内'||type==='開催前リマインド'?ms.filter(m=>e.attendees?.[m.id]==='参加'):ms;let subject=`【${e.type}】${type}（${e.year}年${e.month}月）`,body=type==='日程調整依頼'?`皆さま\n\n${e.type}の日程調整をお願いいたします。\n回答期限：${e.deadline||'別途ご案内'}\n調整さん：${e.scheduleUrl||'URL未登録'}\n\nよろしくお願いいたします。`:type==='未回答者への催促'?`皆さま\n\n日程調整の回答をお願いいたします。\n回答期限：${e.deadline||'未設定'}\n${e.scheduleUrl||''}`:type==='事務局への請求'?`事務局ご担当者さま\n\n${e.type}の費用を請求いたします。\n開催日：${e.date||'未設定'}\n支出総額：${yen(e.cost)}\n参加者負担：${yen(memberSum(e))}\n事務局請求予定：${yen(office(e))}\n領収書は別途添付いたします。`: `皆さま\n\n${e.type}のご案内です。\n日時：${e.date||'未確定'} ${e.time}\n店舗：${v?.name||'未定'}\n住所：${v?.address||'未登録'}\n${v?.url||''}\n会費：参加者別にご案内いたします。\n\nよろしくお願いいたします。`;$('mailTo').value=targets.map(m=>m.email).filter(Boolean).join('; ');$('mailSubject').value=subject;$('mailBody').value=body}function copyMail(){navigator.clipboard?.writeText($('mailSubject').value+'\n\n'+$('mailBody').value).then(()=>alert('コピーしました')).catch(()=>alert('コピーできませんでした'))}function openMail(){let to=$('mailTo').value.replace(/;\s*/g,','),s=$('mailSubject').value,b=$('mailBody').value;location.href=`mailto:${encodeURIComponent(to).replace(/%2C/g,',')}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`}
function members(){return `<section class="panel"><h2>委員名簿</h2><div class="grid">${field('氏名','memberName','')}${field('メール','memberEmail','','email')}${field('所属・備考','memberNote','')}</div><label><input style="width:auto" type="checkbox" id="memberExecutive"> 幹事委員（全体委員にも参加）</label><button class="primary" onclick="addMember()">委員を追加</button><div class="scroll"><table><tr><th>氏名</th><th>メール</th><th>区分</th><th>操作</th></tr>${db.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td>${m.executive?'幹事委員':'全体委員'}</td><td><button onclick="toggleMember('${m.id}')">${m.active===false?'復帰':'退任'}</button></td></tr>`).join('')}</table></div></section>`}function addMember(){let name=$('memberName').value.trim();if(!name){alert('氏名を入力してください');return}update(()=>db.members.push({id:uid(),name,email:$('memberEmail').value.trim(),note:$('memberNote').value,executive:$('memberExecutive').checked,active:true}))}function toggleMember(id){update(()=>{let m=db.members.find(x=>x.id===id);m.active=m.active===false})}function venues(){return `<section class="panel"><h2>店舗台帳</h2><div class="grid">${field('店名','venueName','')}${field('住所','venueAddress','')}${field('電話番号','venuePhone','')}${field('店舗・地図URL','venueUrl','','url')}${field('一人当たり目安（円）','venuePrice',0,'number')}</div><label>メモ・評価</label><textarea id="venueMemo"></textarea><button class="primary" onclick="addVenue()">店舗を追加</button><div class="scroll"><table><tr><th>店舗</th><th>目安</th><th>リンク</th><th>メモ</th></tr>${db.venues.map(v=>`<tr><td>${esc(v.name)}<div class="muted">${esc(v.address)}</div></td><td>${yen(v.price)}</td><td>${link(v.url)}</td><td>${esc(v.memo)}</td></tr>`).join('')}</table></div></section>`}function addVenue(){let name=$('venueName').value.trim();if(!name){alert('店名を入力してください');return}update(()=>db.venues.push({id:uid(),name,address:$('venueAddress').value,phone:$('venuePhone').value,url:$('venueUrl').value,price:Math.max(0,+$('venuePrice').value||0),memo:$('venueMemo').value}))}function finance(){let e=event();return `<section class="panel"><h2>年間予算</h2><div class="grid"><div class="metric">年間予算<b>${yen(db.budget)}</b></div><div class="metric">配分合計<b>${yen(alloc())}</b></div><div class="metric">配分可能残額<b class="${db.budget-alloc()<0?'warn':''}">${yen(db.budget-alloc())}</b></div><div class="metric">事務局負担実績・見込<b>${yen(spent())}</b></div></div><p class="muted">配分額は開催管理で変更できます。予算超過の参加者負担は開催ごとに設定します。</p><div class="scroll"><table><tr><th>開催</th><th>配分額</th><th>支出</th><th>参加者負担</th><th>事務局負担</th><th>状態</th></tr>${db.events.map(x=>`<tr><td>${x.year}/${x.month} ${x.type}</td><td>${yen(x.allocation)}</td><td>${yen(x.cost)}</td><td>${yen(memberSum(x))}</td><td>${yen(office(x))}</td><td>${esc(x.status)}</td></tr>`).join('')}</table></div></section><section class="panel"><h2>開催ごとの支払・請求</h2><label>対象開催</label><select onchange="selected=this.value;render()">${db.events.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${x.year}/${x.month} ${x.type}</option>`).join('')}</select><div class="grid">${field('支払総額（円）','cost',e.cost,'number')}${field('立替者','paidBy',e.paidBy)}${field('支払日','paymentDate',e.paymentDate,'date')}${field('事務局請求日','claimDate',e.claimDate,'date')}${field('事務局精算完了日','settledDate',e.settledDate,'date')}</div><label>領収書画像・PDF（1ファイル）</label><input id="receipt" type="file" accept="image/*,.pdf"><p class="muted">現在の添付：${esc(e.receiptName||'なし')}。この試作版ではブラウザ内保存のため小容量のファイルに限定します。</p><p>事務局負担額（計算値）：<b>${yen(office(e))}</b> ／ 参加者負担合計：<b>${yen(memberSum(e))}</b></p><div class="actions"><button class="primary" onclick="saveFinance()">精算情報を保存</button><button onclick="printClaim()">請求書を印刷・PDF保存</button></div></section>`}async function saveFinance(){let e=event(),cost=+$('cost').value;if(!Number.isFinite(cost)||cost<0){alert('支払総額を確認してください');return}let f=$('receipt').files[0],data=null;if(f){if(f.size>350000){alert('領収書ファイルは350KB以下にしてください。正式版ではクラウド保存に変更します。');return}data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}update(()=>{e.cost=cost;for(let k of ['paidBy','paymentDate','claimDate','settledDate'])e[k]=$(k).value;if(f){e.receiptName=f.name;e.receiptData=data}e.claimAmount=office(e)})}function printClaim(){let e=event(),v=db.venues.find(x=>x.id===e.venueId),html=`<!doctype html><html lang="ja"><meta charset="utf-8"><title>懇親会精算票</title><style>body{font:16px sans-serif;padding:35px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:12px;text-align:left}</style><h1>懇親会 精算・請求票</h1><table>${[['開催区分',e.type],['開催日',e.date],['店舗',v?.name||''],['出席人数',joined(e).length+'人'],['支払総額',yen(e.cost)],['参加者負担額',yen(memberSum(e))],['事務局負担・請求予定額',yen(office(e))],['立替者',e.paidBy],['支払日',e.paymentDate],['請求日',e.claimDate],['領収書',e.receiptName||'未登録']].map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join('')}</table><p>領収書原本は別途添付してください。</p></html>`;let w=window.open('','_blank');if(!w){alert('ポップアップを許可してください');return}w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),300)}function settings(){return `<section class="panel"><h2>年度・予算設定</h2><div class="grid">${field('年度（10月開始年）','year',db.year,'number')}${field('年間予算（円）','budget',db.budget,'number')}</div><div class="actions"><button class="primary" onclick="saveSettings()">設定を保存・均等配分</button></div><p class="muted">年度は10月〜翌年9月です。均等配分は現在の配分額を上書きします。端数は最終回に配分します。</p></section><section class="panel"><h2>データの保存と引継ぎ</h2><p class="warn">このVer.1.1はローカル試作版です。データは使用端末・ブラウザ内だけに保存され、複数端末では同期されません。業務利用前にFirebase認証・クラウド保存へ移行してください。</p><div class="actions"><button onclick="backup()">JSONバックアップを保存</button><button onclick="csvExport()">開催一覧CSV</button></div><label>バックアップJSONを復元</label><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"><h3>新年度を作成</h3><p class="muted">委員・店舗を引き継ぎ、開催履歴はバックアップに残します。実行前に必ずJSONを保存してください。</p><button class="danger" onclick="newYear()">翌年度へ切り替える</button></section>`}function saveSettings(){let b=+$('budget').value,y=+$('year').value;if(!Number.isFinite(b)||b<0||!Number.isInteger(y)||y<2000||y>2200){alert('年度と予算を確認してください');return}if(!confirm('年間予算を12回に均等配分し、既存の配分を上書きします。よろしいですか？'))return;update(()=>{db.budget=b;db.year=y;let q=Math.floor(b/12);db.events.forEach((e,i)=>{e.allocation=q+(i===11?b-q*12:0);e.year=y+(i>=3?1:0)})})}function backup(){download(JSON.stringify(db,null,2),'懇親会管理_'+db.year+'年度.json','application/json')}function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csvExport(){let rows=[['年度','開催年月','区分','開催日','店舗','配分予算','支出','参加者負担','事務局負担','請求日','精算完了日'],...db.events.map(e=>[db.year,`${e.year}/${e.month}`,e.type,e.date,db.venues.find(v=>v.id===e.venueId)?.name||'',e.allocation,e.cost,memberSum(e),office(e),e.claimDate,e.settledDate])];download('\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'懇親会開催一覧_'+db.year+'.csv','text/csv;charset=utf-8')}async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.events)||!Array.isArray(x.members)||!Array.isArray(x.venues)||!Number.isFinite(+x.budget))throw Error('形式が異なります');if(!confirm('現在のデータをバックアップの内容で上書きしますか？'))return;db=x;selected=db.events[0]?.id;save();render()}catch(e){alert('復元できません：'+e.message)}}function newYear(){if(!confirm('必ずバックアップ済みであることを確認してください。新年度へ切り替えますか？'))return;let old=db,n=seed(old.year+1);n.members=old.members.map(m=>({...m}));n.venues=old.venues.map(v=>({...v}));n.budget=old.budget;let q=Math.floor(n.budget/12);n.events.forEach((e,i)=>e.allocation=q+(i===11?n.budget-q*12:0));db=n;selected=n.events[0].id;save();render()}render();</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
