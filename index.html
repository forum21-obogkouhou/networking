<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>委員会懇親会管理</title><meta name="theme-color" content="#173b61"><meta name="description" content="委員会の懇親会を日程調整から精算まで一元管理"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#1c3048;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;line-height:1.6}header{background:linear-gradient(110deg,#173b61,#22587e);color:white;padding:24px max(20px,calc((100vw - 1180px)/2))}header h1{font-size:clamp(21px,2.2vw,28px);letter-spacing:.01em;margin:0}header h1 small{font-size:12px;background:#ffffff24;border:1px solid #ffffff35;padding:3px 9px;border-radius:20px;vertical-align:middle}header>small{color:#d5e7f6;font-size:13px}main{max-width:1180px;margin:0 auto;padding:24px 20px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;padding:5px;background:white;border:1px solid #e3e9f0;border-radius:16px;box-shadow:0 3px 12px #102a4310}nav button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:11px;color:#496179;padding:11px 9px;font-size:13px}nav button.active{background:#1e638e;color:white;box-shadow:0 3px 8px #184e7828}button,.btn{font:inherit;border:1px solid #d4e0e9;border-radius:10px;padding:10px 14px;background:white;color:#205679;cursor:pointer;font-weight:650;transition:background .15s}button:hover{background:#eaf3fa}button.primary,button.active{background:#1c6c9b;color:white;border-color:#1c6c9b}button.primary:hover{background:#15557c}button.danger{color:#aa3343}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #78bde7;outline-offset:2px}.welcome{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:25px 28px;background:linear-gradient(120deg,#e6f1f8,#f6fbff);border:1px solid #d8e8f2;border-radius:18px;margin-bottom:18px}.welcome h2{font-size:clamp(19px,2.2vw,25px);margin:7px 0}.welcome p{color:#536c82;margin:0;font-size:14px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.05em;color:#236f99}.panel{background:white;border:1px solid #e2e9f0;border-radius:16px;padding:22px;margin-bottom:17px;box-shadow:0 5px 22px #203d5709}h2{font-size:19px;margin:0 0 15px;letter-spacing:-.02em}h3{font-size:16px;margin:18px 0 8px}.heading-note{font-size:12px;font-weight:500;color:#73899a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:13px}.metric{background:#fff;border:1px solid #e0eaf1;border-radius:15px;padding:17px 18px;font-size:13px;color:#597188;box-shadow:0 2px 12px #152e4206}.metric b{display:block;font-size:clamp(21px,2.1vw,27px);color:#183e61;margin-top:8px;letter-spacing:-.04em}.muted{color:#687f93;font-size:13px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd9e5;border-radius:10px;padding:11px 12px;background:#fff;font:inherit;font-size:15px;color:#263d52}textarea{min-height:86px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e8eef4;vertical-align:middle}th{background:#f4f8fb;color:#516a80;font-weight:700}.scroll{overflow-x:auto;border:1px solid #e5ecf2;border-radius:11px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.warn{color:#a45c1b}.good{color:#18754a}.pill{display:inline-block;background:#e9f2f9;color:#285b7e;border-radius:99px;padding:4px 11px;font-size:12px}a{color:#156b9b}details{margin:8px 0}.hidden{display:none}footer{padding:25px 4px;color:#8191a1;text-align:center;font-size:12px}@media(min-width:800px){nav{position:sticky;top:8px;z-index:5}#app>.grid:first-child{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){header{padding:22px 18px}main{padding:14px 12px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:16px}nav button{white-space:normal;font-size:12px;min-height:48px;padding:7px 4px}.welcome{padding:18px;display:block}.welcome button{margin-top:15px;width:100%}.panel{padding:17px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px 12px;font-size:12px}.metric b{font-size:21px;overflow-wrap:anywhere}input,select,textarea{min-width:0}.panel>.grid{grid-template-columns:1fr}.actions button{flex:1 1 140px}table{min-width:550px}th,td{padding:9px}h2{font-size:18px}}@media(max-width:370px){nav{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr 1fr}}
.csv-tools{border:1px solid #cbd5e1;border-radius:12px;padding:16px;margin:14px 0;background:#f8fafc}.csv-tools p{margin:7px 0 12px}.csv-tools button,.csv-upload{display:inline-block;vertical-align:middle;width:auto;margin:4px 8px 4px 0;padding:11px 14px;border-radius:9px;border:1px solid #cbd5e1;background:white;color:#17365d;font-weight:600;cursor:pointer;font-size:14px}.csv-upload input{display:none}@media(max-width:600px){.csv-tools button,.csv-upload{display:block;width:100%;text-align:center;margin:8px 0}}
.next-event{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #e2e8f0}.next-event button{width:auto;white-space:nowrap}.guided{border-left:5px solid #2563eb}@media(max-width:600px){.next-event{align-items:flex-start}.next-event button{padding:10px}}
.receipt-picker{display:inline-block;background:#eaf2fc;border:1px solid #9ab9e2;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:650}.receipt-picker{position:relative;overflow:hidden}.receipt-picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}.receipt-gallery{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.receipt-card{width:160px;border:1px solid #ccd7e3;border-radius:10px;padding:10px;background:white;overflow-wrap:anywhere}.receipt-card img{max-width:100%;height:170px;object-fit:contain}.receipt-card button{margin-top:8px}@media(max-width:600px){.receipt-picker{width:100%;text-align:center}.receipt-card{width:calc(50% - 6px)}}.att-scroll{max-height:70vh}.att-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}.att-table th,.att-table td{text-align:center;min-width:80px;border-right:1px solid #e8eef4}.att-table thead th{position:sticky;top:0;z-index:2;background:#eaf2f8}.att-table .att-name{position:sticky;left:0;z-index:1;min-width:135px;max-width:200px;text-align:left;background:#f6f9fc;white-space:normal}.att-table thead .att-name{z-index:3;background:#eaf2f8}.att-table .att-small{font-size:10px;font-weight:normal;color:#637c8f}.att-table .att-state{font-weight:750;font-size:17px}.att-table .att-yes{color:#16734a;background:#f0faf4}.att-table .att-no{color:#a34b4b;background:#fff6f5}.att-table .att-maybe{color:#986b17;background:#fffbec}.att-table .att-other{color:#8a99a5}.att-table .att-total{font-weight:750}.att-table .att-summary th,.att-table .att-summary td{background:#eef4f9;font-weight:750}.att-table .att-summary .att-name{z-index:1;background:#e8f0f7}.att-date{max-width:130px;white-space:normal}
/* Ver.2.26: only the member name remains fixed during horizontal scrolling. */
.att-table .att-meta{min-width:65px;white-space:nowrap;text-align:left;background:#fff;}
.att-table .att-role{min-width:160px;}
.att-table thead .att-meta{background:#eaf2f8;}
.att-table .att-summary .att-meta{background:#e8f0f7;}
.att-table .att-name{left:0;position:sticky;}
</style></head><body><header><h1>委員会懇親会管理 <small>Ver.2.26</small></h1><small>日程調整から精算まで、ひとつに。</small></header><main><nav id="nav" aria-label="メインメニュー"></nav><div id="app"></div><footer>委員会懇親会管理 · データはこの端末内に保存されます。自動バックアップはブラウザ内に保存されます。外部にも退避してください。</footer></main><script>
'use strict';const KEY='konshinkai_v1';const yen=n=>(Number(n)||0).toLocaleString('ja-JP')+'円';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const currentFY=()=>{let d=new Date();return d.getFullYear()-(d.getMonth()<9?1:0)};function seed(y){return {year:y,budget:0,events:[],members:[],venues:[]}}let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.events))db=seed(currentFY());if(!db.fiscalVersion){
 const oldPattern=db.events.length===12 && db.events[0].month===4 && db.events[3].month===7;
 if(oldPattern){
   const active=db.events.some(e=>e.date||e.scheduleUrl||e.venueId||e.cost||e.paymentDate||Object.keys(e.attendees||{}).length);
   if(!active){db.events.forEach((e,i)=>{e.month=(i+9)%12+1;e.year=db.year+(i>=3?1:0)});}
   else {db.migrationNotice='以前の4月始まりの開催データが残っています。既存の入力を守るため自動変更していません。バックアップ後に確認してください。';}
 }
 db.fiscalVersion='oct-sep';try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
}
// Ver.2.2: legacy event categories are normalized without modifying the source spreadsheets.
function normalizeEventTypes(data){if(!data||!Array.isArray(data.events))return false;let changed=false;for(const e of data.events){const mapped=({'正副委員長会':'幹事懇親会','幹事委員':'幹事懇親会','全体委員':'全体懇親会'})[e.type];if(mapped){e.type=mapped;changed=true}}return changed}
if(normalizeEventTypes(db)){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('会合種別の保存に失敗',e)}}
let page='home',selected=db.events[0]?.id;function save(){normalizeEventTypes(db);try{localStorage.setItem(KEY,JSON.stringify(db));scheduleAutoBackup();return true}catch(e){alert('保存できません。領収書画像が大きすぎる可能性があります。JSONバックアップを作成してください。');return false}}function update(fn){fn();save();render()}const $=id=>document.getElementById(id);const event=()=>db.events.find(e=>e.id===selected)||db.events[0];const sortedEvents=()=>db.events.slice().sort((a,b)=>(a.year*12+a.month)-(b.year*12+b.month));const people=e=>db.members.filter(m=>['幹事委員','幹事懇親会','正副委員長会'].includes(e.type)?m.executive:m.active!==false);const joined=e=>Object.entries(e.attendees||{}).filter(([id,s])=>s==='参加').map(([id])=>db.members.find(m=>m.id===id)).filter(Boolean);const attendeeCounts=e=>{const list=people(e),a=e.attendees||{};return {yes:list.filter(m=>a[m.id]==='参加').length,no:list.filter(m=>a[m.id]==='欠席').length,maybe:list.filter(m=>a[m.id]==='未定').length,unknown:list.filter(m=>!a[m.id]||a[m.id]==='未回答').length}};const estimatedCost=e=>Math.max(0,Number(e.reservationUnitPrice)||0)*attendeeCounts(e).yes;const syncEstimatedCost=e=>{if(Number(e.reservationUnitPrice)>0){e.cost=estimatedCost(e);e.claimAmount=office(e)}};const fee=e=>Math.max(0,(+e.cost||0)-memberSum(e));const memberSum=e=>Object.entries(e.fees||{}).reduce((a,[id,amount])=>a+((e.collected||{})[id]?(+amount||0):0),0);const office=e=>Math.max(0,(+e.cost||0)-memberSum(e));const spent=()=>db.events.reduce((a,e)=>a+office(e),0);const field=(label,id,value,type='text')=>`<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`;const select=(label,id,opts,value)=>`<div><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;const link=u=>/^https:\/\//i.test(u||'')?`<a target="_blank" rel="noopener noreferrer" href="${esc(u)}">開く ↗</a>`:'未登録';function render(){const pages=[['home','ホーム'],['events','開催管理'],['attendance','出欠管理'],['members','委員名簿'],['venues','店舗台帳'],['finance','年間予算・精算'],['settings','設定・引継ぎ']];$('nav').innerHTML=pages.map(([k,v])=>`<button aria-current="${page===k?'page':'false'}" class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('app').innerHTML=({home:home,events:events,attendance:attendance,members:members,venues:venues,finance:finance,settings:settings})[page]()}function go(p){page=p;render()}function home(){let e=sortedEvents().find(x=>!x.settledDate)||sortedEvents()[0];return `<section class="welcome"><div><span class="eyebrow">${db.year}年度 · ${db.year}年10月〜${db.year+1}年9月</span><h2>懇親会の運営を、もっとスムーズに。</h2><p>次にやることから始めましょう。初めての方は「設定・引継ぎ」で年間予算を登録してください。</p></div><button class="primary" onclick="go('settings')">年度・予算を設定 →</button></section>${db.migrationNotice?`<section class="panel warn">${esc(db.migrationNotice)}</section>`:''}<div class="grid"><div class="metric">年間予算<b>${yen(db.budget)}</b></div><div class="metric">事務局負担実績・見込<b>${yen(spent())}</b></div><div class="metric">予算残額（実績・見込差引）<b>${yen(db.budget-spent())}</b></div></div><section class="panel" style="margin-top:15px"><h2>次の開催 <span class="heading-note">まずはこちら</span></h2><p><b>${esc(e?.year||'未設定')}年${esc(e?.month||'')}月　${esc(e?.type||'開催を登録してください')}</b>　<span class="pill">${esc(e?.status||'準備前')}</span></p><p class="muted">${esc(e?.date||'開催日未確定')}　${esc(e?.time||'')}</p><button class="primary" onclick="selected='${e?.id||''}';go('events')">開催管理へ</button></section><section class="panel"><h2>やることリスト</h2>${sortedEvents().filter(e=>!e.settledDate).slice(0,6).map(e=>`<p>・${e.year}/${e.month} ${esc(e.type)}：${!e.scheduleUrl?'日程調整URL登録':!e.date?'日程確定':!e.venueId?'店舗予約':!e.paymentDate?'開催・支払記録':!e.claimDate?'事務局への請求':'精算完了確認'}</p>`).join('')}</section>`}function events(){let e=event();if(!e)return `<section class="panel"><h2>開催管理</h2><p>開催予定はまだありません。開催月と会の種類を選んで追加してください。</p>${createEventForm()}</section>`;return `<section class="panel"><h2>開催管理</h2><p class="muted">開催は自由に追加・変更できます。隔月開催は目安で、同じ月に複数回開催することもできます。</p>${createEventForm()}<div class="grid"><div><label>対象の開催</label><select id="eventChoice" onchange="selected=this.value;render()">${sortedEvents().map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${x.year}年${x.month}月 ${x.type}</option>`).join('')}</select></div></div><div class="grid">${select('進捗','status',['準備前','日程調整中','日程確定','予約済み','開催確定','開催済み','精算申請中','精算完了'],e.status)}${select('開催月','eventMonth',Array.from({length:12},(_,i)=>String(i+1)),String(e.month))}${select('会の種類','eventType',['全体懇親会','幹事懇親会','その他'],e.type)}${field('開催日','date',e.date,'date')}${field('開始時刻','time',e.time,'time')}${field('会合名（報告書用）','meetingName',e.meetingName??(e.type+' 懇親会'))}${field('会合の目的（報告書用）','meetingPurpose',e.meetingPurpose??(e.type+'委員の懇親'))}${field('調整さんURL','scheduleUrl',e.scheduleUrl,'url')}${field('回答締切','deadline',e.deadline,'date')}${select('店舗','venueId',['未選択',...db.venues.map(v=>v.name),'＋ 新しい店舗を登録'],db.venues.find(v=>v.id===e.venueId)?.name||'未選択')}<div id="newVenueBox" style="display:none;grid-column:1/-1;padding:12px;border:1px solid #9cb8cf;border-radius:10px"><strong>新しい店舗を登録</strong>${field('店舗名（必須）','quickVenueName','')}${field('住所','quickVenueAddress','')}${field('電話番号','quickVenuePhone','tel')}${field('店舗URL','quickVenueUrl','url')}${field('一人当たり目安（円）','quickVenuePrice','','number')}<p class="muted">開催情報を保存すると店舗台帳にも自動追加され、次回から選択できます。</p></div>${field('予約時の一人当たり単価（円）','reservationUnitPrice',e.reservationUnitPrice??'','number')}${field('予約番号・予約名義','reservation',e.reservation)}${field('キャンセル期限','cancelDeadline',e.cancelDeadline,'date')}</div><label>メモ</label><textarea id="memo">${esc(e.memo)}</textarea><div class="actions"><button class="primary" onclick="saveEvent()">開催情報を保存</button><button class="danger" onclick="deleteEvent()">この開催を削除</button><button onclick="window.open('https://chouseisan.com/','_blank','noopener')">調整さんを開く</button><span>${link(e.scheduleUrl)}</span></div></section><section class="panel"><h2>調整さんの回答を取り込む</h2><p class="muted">調整さんから出力したCSV（Shift_JIS／UTF-8）を読み込むか、回答一覧を貼り付けて、登録名と委員名簿を紐づけます。自動照合した結果も保存前に確認できます。調整さんのページから自動取得はしません。</p><textarea id="chouseisanPaste" rows="6" placeholder="調整さんの回答一覧をコピーして貼り付けてください。例：&#10;山田 太郎　○&#10;佐藤 花子　×"></textarea><div class="actions"><label class="receipt-picker">CSVファイルを選択<input type="file" accept=".csv,text/csv" onchange="loadChouseisanCSV(this.files[0]);this.value=''" /></label><button onclick="previewChouseisan()">貼り付け内容を確認・照合</button></div><div id="chouseisanCsvInfo" class="muted"></div><div id="chouseisanPreview"></div></section><section class="panel"><h2>参加者・会費</h2><p class="muted">名簿で登録した委員を表示します。出欠確定後、必要に応じて個別会費を入力してください。</p><div id="attendanceTotals" class="grid"><div class="metric">参加<b id="attendanceYes">${attendeeCounts(e).yes}名</b></div><div class="metric">欠席<b id="attendanceNo">${attendeeCounts(e).no}名</b></div><div class="metric">未定<b id="attendanceMaybe">${attendeeCounts(e).maybe}名</b></div><div class="metric">未回答<b id="attendanceUnknown">${attendeeCounts(e).unknown}名</b></div></div><div class="scroll"><table><thead><tr><th>氏名</th><th>出欠</th><th>参加者負担（円）</th><th>徴収済</th></tr></thead><tbody>${people(e).map(m=>`<tr><td>${esc(m.name)}</td><td><select id="a_${m.id}" onchange="updateAttendanceTotals()">${['未回答','参加','欠席','未定'].map(s=>`<option ${((e.attendees||{})[m.id]||'未回答')===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input type="number" min="0" id="f_${m.id}" value="${(e.fees||{})[m.id]||0}"></td><td><input type="checkbox" id="c_${m.id}" ${(e.collected||{})[m.id]?'checked':''}></td></tr>`).join('')}</tbody></table></div><p>支出見込・実績：<b>${yen(e.cost)}</b> ／ 超過額：<b>${yen(fee(e))}</b> ／ 参加者負担設定合計：<b>${yen(memberSum(e))}</b></p><div class="actions"><button onclick="splitFees()">超過額を参加予定者に均等割り</button><button class="primary" onclick="saveAttendance()">出欠・会費を保存</button></div></section><section class="panel"><h2>メール文面作成</h2><label>メール種別</label><select id="mailType" onchange="draftMail()"><option>日程調整依頼</option><option>未回答者への催促</option><option>開催案内</option><option>開催前リマインド</option><option>事務局への請求</option></select><label>宛先（To・送信前に編集できます）</label><textarea id="mailTo"></textarea><label>CC</label><input id="mailCc" type="text" placeholder="CCがある場合のみ"><label>件名</label><input id="mailSubject"><label>本文</label><textarea id="mailBody" style="min-height:175px"></textarea><div class="actions"><button onclick="draftMail()">文面生成</button><button onclick="copyMail()">件名・本文をコピー</button><button onclick="openMail()">メールアプリを開く</button></div><p class="muted">送信はメールアプリで行います。このアプリは送信完了を自動検知しません。</p></section>`}function createEventForm(){return `<div class="panel" style="background:#f0f6fc;margin:12px 0"><h3>＋ 開催を追加</h3><div class="grid">${select('開催月','newMonth',Array.from({length:12},(_,i)=>String(i+1)),String(new Date().getMonth()+1))}${select('会の種類','newType',['全体懇親会','幹事懇親会','その他'],'全体懇親会')}</div><button class="primary" onclick="addEvent()">この内容で開催を追加</button></div>`}function addEvent(){let month=Number($('newMonth').value),type=$('newType').value;let y=db.year+(month<10?1:0);let e={id:uid(),month,year:y,type,date:'',time:'19:00',status:'準備前',venueId:'',scheduleUrl:'',deadline:'',reservation:'',cancelDeadline:'',memo:'',attendees:{},fees:{},collected:{},cost:0,reservationUnitPrice:null,paidBy:'',paymentDate:'',receiptName:'',receiptData:'',claimDate:'',claimAmount:null,settledDate:'',sent:[]};update(()=>{db.events.push(e);selected=e.id})}function deleteEvent(){let e=event();if(!e)return;if(!confirm(`${e.year}年${e.month}月の${e.type}を削除しますか？参加者・精算記録も削除されます。`))return;update(()=>{db.events=db.events.filter(x=>x.id!==e.id);selected=db.events[0]?.id||''})}function saveEvent(){let e=event(),v=$('venueId').value;let adding=v==='＋ 新しい店舗を登録';let newName=adding?$('quickVenueName').value.trim():'';if(adding){if(!newName){alert('新しい店舗名を入力してください');$('quickVenueName').focus();return}let duplicate=db.venues.find(x=>x.name.trim().toLocaleLowerCase()===newName.toLocaleLowerCase());if(duplicate){if(!confirm('同じ名前の店舗が既にあります。既存の店舗を使用しますか？'))return;v=duplicate.name;adding=false;}}update(()=>{for(let k of ['status','date','time','scheduleUrl','deadline','reservation','cancelDeadline','memo','meetingName','meetingPurpose'])e[k]=$(k).value;e.month=Number($('eventMonth').value);e.year=db.year+(e.month<10?1:0);e.type=$('eventType').value;const unitText=$('reservationUnitPrice').value.trim();if(unitText!==''&&(!Number.isFinite(Number(unitText))||Number(unitText)<0)){alert('予約単価を確認してください');return}e.reservationUnitPrice=unitText===''?null:Number(unitText);syncEstimatedCost(e);if(adding){const venue={id:uid(),name:newName,address:$('quickVenueAddress').value.trim(),phone:$('quickVenuePhone').value.trim(),url:$('quickVenueUrl').value.trim(),price:Math.max(0,+$('quickVenuePrice').value||0),memo:''};db.venues.push(venue);e.venueId=venue.id}else{e.venueId=db.venues.find(x=>x.name===v)?.id||''}})}function updateAttendanceTotals(){const e=event();if(!e)return;const values=people(e).map(m=>document.getElementById('a_'+m.id)?.value||'未回答');for(const [id,val] of [['attendanceYes','参加'],['attendanceNo','欠席'],['attendanceMaybe','未定'],['attendanceUnknown','未回答']]){const node=document.getElementById(id);if(node)node.textContent=values.filter(x=>x===val).length+'名'}}function saveAttendance(){let e=event();update(()=>{e.attendees=e.attendees||{};e.fees=e.fees||{};e.collected=e.collected||{};people(e).forEach(m=>{e.attendees[m.id]=$('a_'+m.id).value;e.fees[m.id]=Math.max(0,+$('f_'+m.id).value||0);e.collected[m.id]=$('c_'+m.id).checked});syncEstimatedCost(e)})}function splitFees(){let e=event(),ids=people(e).filter(m=>$('a_'+m.id).value==='参加');if(!ids.length){alert('参加予定者を選択してください');return}let x=fee(e),q=Math.floor(x/ids.length),r=x%ids.length;people(e).forEach(m=>{$('f_'+m.id).value=0});ids.forEach((m,i)=>{$('f_'+m.id).value=q+(i<r?1:0)});alert('会費を入力欄に配分しました。「出欠・会費を保存」で確定してください')}function mailEventName(e){
 const saved=(e.meetingName||'').trim();
 if(saved&&!/^(全体懇親会|幹事懇親会|その他)\s*懇親会$/.test(saved)&&saved!==e.type+' 懇親会')return saved;
 const all=db.events.filter(x=>x.type===e.type).slice().sort((a,b)=>String(a.date||`${a.year}-${String(a.month).padStart(2,'0')}`).localeCompare(String(b.date||`${b.year}-${String(b.month).padStart(2,'0')}`)));
 const i=all.findIndex(x=>x.id===e.id);const n=i<0?1:i+1;
 const kanji=['','第一','第二','第三','第四','第五','第六','第七','第八','第九','第十'];
 return `${db.obogTerm||'期数未設定'}期広報委員会${kanji[n]||'第'+n}回${e.type}`;
}
function mailDate(e){
 if(!e.date)return '未確定';
 const d=new Date(e.date+'T12:00:00');if(Number.isNaN(d.getTime()))return e.date;
 return `${e.date.replace(/-/g,'/')}（${'日月火水木金土'[d.getDay()]}）`;

function mailOrganizer(){const name=(db.organizerSurname||'').trim();return name||'（懇親会係の苗字を設定してください）'}
function mailOpening(e){const term=db.obogTerm||'期数未設定';const audience=e.type==='幹事懇親会'?'幹事委員':'広報委員';return `${term}期${audience}の皆さま\n\nお世話になります。\n${term}期広報委員会懇親会係の${mailOrganizer()}です。`}
function mailVenueBlock(e,v){const counts=attendeeCounts(e);return `■${mailEventName(e)}\n日時：${e.date?e.date+' '+(e.time||'時刻未設定'):'未確定'}\n店舗：${v?.name||'未定'}\n住所：${v?.address||'未登録'}${v?.url?'\n'+v.url:''}\n参加：${counts.yes}名（参加者は調整さんを参照ください）${e.scheduleUrl?'\n'+e.scheduleUrl:''}`}
function draftMail(){
 const e=event();if(!e)return;
 const v=db.venues.find(x=>x.id===e.venueId),type=$('mailType').value,term=db.obogTerm||'期数未設定';
 const name=mailOrganizer(),hello=mailOpening(e),meeting=mailEventName(e);
 const schedule=e.scheduleUrl||'（調整さんURL未登録）';

  '日程調整依頼':`${hello}\n\n${meeting}を開催したいと思います。\n皆さまのご都合を確認したく、以下の調整さんへのご登録をお願いいたします。\n\n■${meeting}\n開催時期：${e.year}年${e.month}月頃\n回答期限：${e.deadline||'別途ご案内'}\n調整さん：${schedule}\n\nお忙しいところ恐縮ですが、ご協力のほどお願いいたします。${close}`,
  '未回答者への催促':`${hello}\n\n先日ご案内した${meeting}の日程調整について、再度ご連絡いたします。\nまだご回答がお済みでない方は、以下の調整さんからご登録いただけますと幸いです。\n\n回答期限：${e.deadline||'別途ご案内'}\n調整さん：${schedule}\n\nすでにご回答いただいている場合は、行き違いにつきご容赦ください。${close}`,
  '開催案内':`${hello}\n\n調整さんへのご登録、誠にありがとうございました。\nいただいたご都合を踏まえ、${date}を開催日とさせていただきます。\n\n${mailVenueBlock(e,v)}\n\nご都合が悪くなった、あるいは急遽参加できるようになったなどの場合は、\n${name}までお知らせください。\n\n皆さまと懇親を深められることを心より楽しみにしております。${close}`,
  '開催前リマインド':`${hello}\n\n${meeting}の開催が近づいてまいりましたので、改めてご案内いたします。\n\n${mailVenueBlock(e,v)}\n\nご都合に変更がありましたら、${name}までお知らせください。\n当日、皆さまとお会いできることを楽しみにしております。${close}`,
  '事務局への請求':`フォーラム21 OB・OG部会 事務局\nご担当者様\n\nお世話になっております。\n${term}期広報委員会懇親会係の${name}です。\n\n下記の会合について、会合等開催報告書と領収書をお送りします。\n立替払い分のお振込みをお願いいたします。\n\n会合名：${meeting}\n開催日：${e.date||'（要確認）'}\n開催場所：${v?.name||'（要確認）'}\n支払い総額：${yen(e.cost||0)}\n参加者負担：${yen(memberSum(e))}\n事務局請求予定額：${yen(office(e))}\n立替者：${e.paidBy||'（要確認）'}\n\n【添付】\n・会合等開催報告書\n・領収書\n\nお手数ですが、内容をご確認ください。${close}`
 };
 const subject=`【${term}広報委員会】${meeting} ${type}${e.date?'（'+e.date+'）':''}`;
 const ms=people(e),targets=type==='未回答者への催促'?ms.filter(m=>!e.attendees?.[m.id]||e.attendees[m.id]==='未回答'):ms;
 const to=type==='事務局への請求'?(db.officeEmail??'mayumi.onoue@umezuzaidan.org'):(e.type==='全体懇親会'?db.committeeEmail:e.type==='幹事懇親会'?db.executiveEmail:'')||targets.map(m=>m.email).filter(Boolean).join('; ');
 $('mailTo').value=to||'';$('mailCc').value=type==='事務局への請求'?(db.executiveEmail||''):'';$('mailSubject').value=subject;$('mailBody').value=bodies[type]||'';
}
function copyMail(){navigator.clipboard?.writeText($('mailSubject').value+'\n\n'+$('mailBody').value).then(()=>alert('コピーしました')).catch(()=>alert('コピーできませんでした'))}function openMail(){let to=$('mailTo').value.trim().replace(/;\s*/g,','),cc=($('mailCc')?.value||'').trim().replace(/;\s*/g,','),s=$('mailSubject').value,b=$('mailBody').value;if(!to){alert('宛先が未登録です。設定画面の「メールアドレス登録」を確認してください。');return}const q=[];if(cc)q.push('cc='+encodeURIComponent(cc).replace(/%2C/gi,','));q.push('subject='+encodeURIComponent(s),'body='+encodeURIComponent(b));location.href='mailto:'+encodeURIComponent(to).replace(/%2C/gi,',')+'?'+q.join('&')}
let editingMemberId=null;
function memberRole(m){return m.advisor?'アドバイザー委員':(!m.executive?'全体委員':(['委員長','副委員長'].includes(m.executiveRole)?'幹事委員・'+m.executiveRole:'幹事委員'))}
function attendance(){
 const all=sortedEvents().slice().sort((a,b)=>{const da=a.date||`${a.year}-${String(a.month).padStart(2,'0')}-99`,dbb=b.date||`${b.year}-${String(b.month).padStart(2,'0')}-99`;return da.localeCompare(dbb)||String(a.id).localeCompare(String(b.id))});
 const ms=db.members.slice();
 const state=(e,m)=>{if(!people(e).some(x=>x.id===m.id))return '対象外';return e.attendees?.[m.id]||'未回答'};
 const symbol=v=>({'参加':'○','欠席':'×','未定':'△','未回答':'－','対象外':'／'})[v]||'－';
 const counts=all.map(e=>{const x=attendeeCounts(e);return {e,...x}});
 const heading=all.map((e,i)=>`<th class="att-date" title="${esc(e.type||'')} ${esc(e.date||'日付未設定')}"><span class="att-small">第${i+1}回</span><br>${esc(e.date?e.date.replace(/-/g,'/'):e.year+'年'+e.month+'月')}<br><span class="att-small">${esc(e.type||'')}</span></th>`).join('');
 const rows=ms.map(m=>`<tr><th class="att-name">${esc(m.name||'氏名未設定')}${m.active===false?'<span class="att-small">（退任）</span>':''}</th><td class="att-meta">${esc(m.term??'')}${m.term?'期':''}</td><td class="att-meta att-role">${esc(memberRole(m))}</td>${all.map(e=>{const v=state(e,m);return `<td class="att-state att-${v==='参加'?'yes':v==='欠席'?'no':v==='未定'?'maybe':'other'}" title="${esc(m.name)}：${esc(v)}">${symbol(v)}</td>`}).join('')}<td class="att-total">${all.filter(e=>state(e,m)==='参加').length}</td></tr>`).join('');
 const totals=[['参加','yes'],['欠席','no'],['未定','maybe'],['未回答','unknown']].map(([label,key])=>`<tr class="att-summary"><th class="att-name">${label} 合計</th><td class="att-meta"></td><td class="att-meta"></td>${counts.map(c=>`<td class="att-total">${c[key]}</td>`).join('')}<td>—</td></tr>`).join('');
 return `<section class="panel"><h2>出欠管理 <span class="heading-note">開催回・開催日 × 委員</span></h2><p class="muted">現在の${esc(db.year)}年度の開催を横軸、委員名簿を縦軸にしたクロス集計です。開催管理で保存した出欠と調整さんから取り込んだ回答を自動反映します。出欠の変更は開催管理で行ってください。</p><div class="actions"><button onclick="exportAttendanceCSV()">クロス集計をCSV出力</button></div><p class="muted">○ 参加　× 欠席　△ 未定　－ 未回答　／ 対象外（会の種類による）</p>${all.length?`<div class="scroll att-scroll"><table class="att-table"><thead><tr><th class="att-name">委員名</th><th class="att-meta">期</th><th class="att-meta att-role">区分・役職</th>${heading}<th>参加回数</th></tr></thead><tbody>${rows}${totals}</tbody></table></div><p class="muted">※ 開催回は開催日順です。開催日未設定の会は開催月順に配置します。参加回数には「参加」のみを計上します。</p>`:'<p>開催情報がありません。「開催管理」で開催を追加してください。</p>'}</section>`;
}
function exportAttendanceCSV(){
 const all=sortedEvents().slice().sort((a,b)=>(a.date||`${a.year}-${String(a.month).padStart(2,'0')}-99`).localeCompare(b.date||`${b.year}-${String(b.month).padStart(2,'0')}-99`)||String(a.id).localeCompare(String(b.id)));
 const ms=db.members.slice();
 const val=(e,m)=>people(e).some(x=>x.id===m.id)?(e.attendees?.[m.id]||'未回答'):'対象外';
 const rows=[['委員名','期','区分・役職',...all.map((e,i)=>`第${i+1}回 ${e.date||e.year+'年'+e.month+'月'} ${e.type||''}`),'参加回数'],...ms.map(m=>[m.name,m.term?m.term+'期':'',memberRole(m),...all.map(e=>val(e,m)),all.filter(e=>val(e,m)==='参加').length])];
 for(const [label,key] of [['参加','yes'],['欠席','no'],['未定','maybe'],['未回答','unknown']])rows.push([label+' 合計','','',...all.map(e=>attendeeCounts(e)[key]),'']);
 const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');

}
function members(){const editing=db.members.find(m=>m.id===editingMemberId);return `<section class="panel"><h2>委員名簿</h2><div class="csv-tools"><strong>CSVで名簿を管理</strong><p class="muted">Excelで編集したCSVを取り込めます。既存IDが一致する行は更新し、新しい行は追加します。</p><button onclick="exportTableCSV('members')">委員名簿をCSV出力</button><label class="csv-upload">CSVをインポート<input type="file" accept=".csv,text/csv" onchange="importTableCSV('members',this.files[0]);this.value=''" /></label></div><h3>${editing?'委員情報を編集':'委員を追加'}</h3><div class="grid">${field('氏名','memberName',editing?.name||'')}${field('期（数字）','memberTerm',editing?.term??'','number')}${field('委員の実施期（数字）','memberServiceTerm',editing?.serviceTerm??db.obogTerm??33,'number')}${field('メール','memberEmail',editing?.email||'','email')}${field('所属・備考','memberNote',editing?.note||'')}</div><div><label for="memberRole">委員区分・役職</label><select id="memberRole">${editing?.executive&&!editing?.advisor&&!'委員長,副委員長'.split(',').includes(editing?.executiveRole)?'<option value="" selected disabled>役職を選択してください</option>':''}<option value="全体委員" ${!editing?.executive&&!editing?.advisor?'selected':''}>全体委員</option><option value="委員長" ${editing?.executiveRole==='委員長'?'selected':''}>幹事委員・委員長</option><option value="副委員長" ${editing?.executiveRole==='副委員長'?'selected':''}>幹事委員・副委員長</option><option value="アドバイザー委員" ${editing?.advisor?'selected':''}>アドバイザー委員</option></select></div><div class="actions"><button class="primary" onclick="saveMember()">${editing?'変更を保存':'委員を追加'}</button>${editing?'<button onclick="cancelMemberEdit()">編集をキャンセル</button>':''}</div><div class="scroll"><table><tr><th>氏名</th><th>期</th><th>実施期</th><th>メール</th><th>区分・役職</th><th>操作</th></tr>${db.members.map(m=>`<tr><td>${esc(m.name)}${m.active===false?'（退任）':''}</td><td>${esc(m.term??'')}${m.term?'期':''}</td><td>${esc(m.serviceTerm??'')}${m.serviceTerm?'期':''}</td><td>${esc(m.email||'')}</td><td>${esc(memberRole(m))}</td><td><button onclick="editMember('${m.id}')">編集</button> <button onclick="toggleMember(  const v=db.venues.find(x=>x.id===e.venueId),term=db.obogTerm||'期数未設定',name=mailOrganizer();
 $('mailTo').value=to;$('mailCc').value=cc;

ronment" onchange="addReceipts(this.files);this.value=''"></label><label class="receipt-picker">＋ 写真・PDFを追加<input type="file" accept="image/*,application/pdf,.pdf" multiple onchange="addReceipts(this.files);this.value=''"></label></div><div id="receiptGallery" class="receipt-gallery">領収書を読み込み中…</div><p class="muted">領収書画像は端末内のIndexedDBに保存します。端末故障・ブラウザデータ削除に備えて別途保管してください。PDFは報告書内には埋め込まず、別添として案内します。</p><p>事務局負担額（計算値）：<b>${yen(office(e))}</b> ／ 参加者負担合計：<b>${yen(memberSum(e))}</b></p><div class="actions"><button class="primary" onclick="saveFinance()">精算情報を保存</button><button onclick="printMeetingReport()">領収書付き開催報告書を印刷・PDF保存</button><button onclick="openClaimEmailDraft()">事務局へのメール文面を作成（幹事CC）</button></div><div id="claimEmailDraft" style="display:none" class="panel"><h3>事務局宛メール（送信前の確認）</h3><p class="muted">宛先と本文を確認し、必要に応じて編集してください。「PDFを作成して共有」から対応端末の共有メニューでメールアプリを選ぶとPDFを添付できます。ただし共有時は宛先・CC・本文の自動入力を保証できません。「メールアプリを開く」は宛先・CC・本文を設定できますが、PDF添付は手動です。送信前に必ずご確認ください。</p><label for="mailTo">宛先（To）</label><input id="mailTo" type="email"><label for="mailCc">CC（幹事メーリングリスト）</label><input id="mailCc" type="email"><label for="mailSubject">件名</label><input id="mailSubject" type="text"><label for="mailBody">本文（編集できます）</label><textarea id="mailBody" rows="13" style="width:100%;min-height:260px"></textarea><div class="actions"><button class="primary" onclick="shareClaimReportPdf()">報告書PDFを作成して共有（対応端末）</button><button onclick="launchClaimEmail()">宛先・本文を設定してメールアプリを開く（添付は手動）</button><button onclick="copyClaimEmail()">メール文面をコピー</button></div></div></section>`}async function saveFinance(){let e=event(),cost=+$('cost').value;if(!Number.isFinite(cost)||cost<0){alert('支払総額を確認してください');return}update(()=>{e.cost=Number(e.reservationUnitPrice)>0?estimatedCost(e):cost;for(let k of ['paidBy','paymentDate','claimDate','settledDate'])e[k]=$(k).value;e.meetingName=$('reportMeetingName').value.trim();e.meetingPurpose=$('reportMeetingPurpose').value.trim();e.claimAmount=office(e)});alert('精算情報を保存しました。領収書は下の「領収書を撮影・追加」から登録してください。')}
function printClaim(){let e=event(),v=db.venues.find(x=>x.id===e.venueId),html=`<!doctype html><html lang="ja"><meta charset="utf-8"><title>懇親会精算票</title><style>body{font:16px sans-serif;padding:35px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:12px;text-align:left}.csv-tools{border:1px solid #cbd5e1;border-radius:12px;padding:16px;margin:14px 0;background:#f8fafc}.csv-tools p{margin:7px 0 12px}.csv-tools button,.csv-upload{display:inline-block;vertical-align:middle;width:auto;margin:4px 8px 4px 0;padding:11px 14px;border-radius:9px;border:1px solid #cbd5e1;background:white;color:#17365d;font-weight:600;cursor:pointer;font-size:14px}.csv-upload input{display:none}@media(max-width:600px){.csv-tools button,.csv-upload{display:block;width:100%;text-align:center;margin:8px 0}}

SONを復元（領収書画像は含まれません）</label><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"><h3>領収書を含む完全バックアップ・年度引継ぎ</h3><p class="muted">最初に「完全バックアップを作成」を押し、ダウンロードしたファイルを安全な場所へ保存してください。後任者は同じアプリで読み込むだけで、名簿・開催履歴・予算・領収書・OCR結果を復元できます。画像が多い場合はファイルが大きくなります。</p><div class="actions"><button class="primary" onclick="exportFullHandover()">① 完全バックアップを作成（領収書込み）</button></div><label>② 完全バックアップ・引継ぎファイルを読み込む</label><input type="file" accept=".json,application/json" onchange="importFullHandover(this)"><p id="handoverStatus" class="muted" role="status"></p><h3>ブラウザ内の自動バックアップ（領収書画像は対象外）</h3><p class="muted">変更後およびアプリ起動時に、前回から24時間以上経過していれば開催・名簿などのデータをブラウザ内へ自動保存します（最新30件）。領収書画像は含まれません。アプリを閉じている間は実行できません。ブラウザデータの削除や端末故障に備え、JSONも定期的に外部保管してください。</p><div id="autoBackupStatus" class="muted">確認中…</div><div class="actions"><button onclick="createAutoBackup(true)">今すぐ保存</button><button onclick="exportLatestAutoBackup()">最新バックアップをJSON出力</button></div><div id="autoBackupList"></div><h3>過年度の開催履歴</h3><div class="muted">${(db.archivedYears||[]).length?(db.archivedYears||[]).map(y=>`<details><summary>${esc(y.year)}年度：${y.events.length}件</summary>${y.events.map(e=>`<p>${esc(e.year)}年${esc(e.month)}月 ${esc(e.type)}／${esc(e.date||"日付未設定")}／支払 ${yen(e.cost||0)}</p>`).join("")}</details>`).join(""):"まだ過年度履歴はありません。"}</div><h3>新年度を作成</h3><p class="muted">委員・店舗を引き継ぎ、開催履歴はアプリ内の過年度履歴にも残します。領収書画像も引き継ぐため、実行前に必ず「完全バックアップ」を保存してください。</p><button class="danger" onclick="newYear()">翌年度へ切り替える</button></section>`}function saveSettings(){let b=+$('budget').value,y=+$('year').value,term=+$('obogTerm').value;if(!Number.isInteger(term)||term<1||term>999){alert('OB・OG部会の期数を1〜999の整数で入力してください');return}if(!Number.isFinite(b)||b<0||!Number.isInteger(y)||y<2000||y>2200){alert('年度と予算を確認してください');return}if(y!==db.year&&!confirm('年度を変更すると、開催月に応じて開催年も変更されます。よろしいですか？'))return;update(()=>{db.budget=b;db.year=y;db.obogTerm=term;for(const k of ['bankBranch','bankType','bankNumber','bankHolder','bankPhone','officeEmail','executiveEmail','committeeEmail','organizerSurname'])db[k]=$(k).value;db.events.forEach(e=>e.year=y+(e.month<10?1:0))})}function backup(){download(JSON.stringify(db,null,2),'懇親会管理_'+db.year+'年度.json','application/json')}function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csvExport(){let rows=[['年度','開催年月','区分','開催日','店舗','支出','参加者負担','事務局負担','請求日','精算完了日'],...db.events.map(e=>[db.year,`${e.year}/${e.month}`,e.type,e.date,db.venues.find(v=>v.id===e.venueId)?.name||'',e.cost,memberSum(e),office(e),e.claimDate,e.settledDate])];download('\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'懇親会開催一覧_'+db.year+'.csv','text/csv;charset=utf-8')}async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.events)||!Array.isArray(x.members)||!Array.isArray(x.venues)||!Number.isFinite(+x.budget))throw Error('形式が異なります');if(!confirm('現在のデータをバックアップの内容で上書きしますか？'))return;db=x;selected=db.events[0]?.id;save();render()}catch(e){alert('復元できません：'+e.message)}}function newYear(){if(!confirm('領収書込みの完全バックアップを保存済みですか？ まだなら「キャンセル」で戻ってください。新年度へ切り替えますか？'))return;let old=db,n=seed(old.year+1);n.members=old.members.map(m=>({...m}));n.venues=old.venues.map(v=>({...v}));n.budget=old.budget;for(const k of ['bankBranch','bankType','bankNumber','bankHolder','bankPhone','officeEmail','executiveEmail','committeeEmail','organizerSurname'])n[k]=old[k]||'';n.archivedYears=[...(old.archivedYears||[]),{year:old.year,budget:old.budget,events:structuredClone(old.events)}];db=n;selected='';save();render()}

function parseCSV(text){text=text.replace(/^\ufeff/,'');const rows=[],row=[];let cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"'){if(cell!=='')throw Error('引用符の位置が不正です');quoted=true}else if(c===','){row.push(cell);cell=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row.slice());row.length=0;cell=''}else cell+=c}if(quoted)throw Error('引用符が閉じられていません');row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}

or?'':executiveRole,advisor,term:termText?Number(termText):'',serviceTerm:serviceTermText?Number(serviceTermText):'',active:bool(r[5],'在任')}}else{const price=Number(r[5]);if(!Number.isFinite(price)||price<0||!Number.isInteger(price))throw Error((i+2)+'行目の価格が不正です');item={id:id||uid(),name,address:r[2],phone:r[3],url:r[4],price,memo:r[6]}}changes.push(item)}const updated=changes.filter(x=>current.some(y=>y.id===x.id)).length,added=changes.length-updated;if(!confirm(`${kind==='members'?'委員名簿':'店舗台帳'}を取り込みます。\n更新：${updated}件、新規：${added}件\nCSVにない既存データは残します。続けますか？`))return;update(()=>{for(const item of changes){const ix=current.findIndex(x=>x.id===item.id);if(ix>=0){if(kind==='members'&&header.length<10)delete item.serviceTerm;current[ix]={...current[ix],...item}}else current.push(item)}});alert(`取り込み完了：更新${updated}件、新規${added}件`)}catch(e){alert('CSV取り込みに失敗しました：'+e.message+'\nUTF-8形式のCSVをご利用ください。')}}

async function receiptImageForPrint(r){
 const src=await blobDataURL(r.blob),deg=((Number(r.rotation)||0)%360+360)%360;
 if(!deg)return src;
 return await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=deg%180?im.naturalHeight:im.naturalWidth;c.height=deg%180?im.naturalWidth:im.naturalHeight;const ctx=c.getContext('2d');ctx.translate(c.width/2,c.height/2);ctx.rotate(deg*Math.PI/180);ctx.drawImage(im,-im.naturalWidth/2,-im.naturalHeight/2);resolve(c.toDataURL('image/jpeg',0.86))};im.onerror=()=>reject(Error('領収書画像を読み込めません'));im.src=src});
}

// 領収書はlocalStorageではなくIndexedDBへ保存（画像は長辺1800pxを上限に圧縮）
const RECEIPT_DB='konshinkai_receipts_v1',RECEIPT_STORE='receipts';
function receiptDB(){return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;reject(Error('端末の保存領域に接続できません。ブラウザのプライベートモードや容量不足をご確認ください。'))}},10000);try{const q=indexedDB.open(RECEIPT_DB,1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains(RECEIPT_STORE)){const st=d.createObjectStore(RECEIPT_STORE,{keyPath:'id'});st.createIndex('eventId','eventId')}};q.onsuccess=()=>{if(settled){q.result.close();return}settled=true;clearTimeout(timer);resolve(q.result)};q.onerror=()=>{if(settled)return;settled=true;clearTimeout(timer);reject(q.error||Error('IndexedDBを開けません'))};q.onblocked=()=>{if(settled)return;settled=true;clearTimeout(timer);reject(Error('別の画面がデータベースを使用中です。アプリの他のタブを閉じてください。'))}}catch(e){clearTimeout(timer);reject(e)}})}
async function getReceipts(eventId){const d=await receiptDB();return new Promise((resolve,reject)=>{const t=d.transaction(RECEIPT_STORE,'readonly');const q=t.objectStore(RECEIPT_STORE).index('eventId').getAll(eventId);q.onsuccess=()=>resolve(q.result.sort((a,b)=>a.created-b.created));q.onerror=()=>reject(q.error);t.oncomplete=()=>d.close()})}
function blobDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function compressReceipt(file){if(!file.type.startsWith('image/'))return file;const img=new Image(),url=URL.createObjectURL(file);try{await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(Error('画像を読み込めません'));img.src=url});const scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('画像圧縮に失敗しました')),'image/jpeg',.86))}finally{URL.revokeObjectURL(url)}}
async function addReceipts(files){
 const e=event();if(!e){alert('先に対象の開催を選択してください');return}
 const selected=Array.from(files||[]);if(!selected.length)return;
 const gallery=document.getElementById('receiptGallery');
 let ok=0;const errors=[];
 if(gallery)gallery.textContent='領収書を保存しています…（'+selected.length+'件）';
 for(const f of selected){
  let d=null;
  try{
   if(!f.type.startsWith('image/')&&f.type!=='application/pdf'&&!/\.(heic|heif|jpg|jpeg|png|webp|pdf)$/i.test(f.name))throw Error('画像かPDFを選択してください');
   if(f.size>20*1024*1024)throw Error('20MB以下のファイルを選択してください');
   let blob;
   try{blob=await compressReceipt(f)}catch(err){
    // HEICなど、端末がCanvas変換できない形式は原本を保存する。
    blob=f;
   }
   d=await receiptDB();
   await new Promise((resolve,reject)=>{
    const t=d.transaction(RECEIPT_STORE,'readwrite');
    const request=t.objectStore(RECEIPT_STORE).put({id:uid(),eventId:e.id,name:f.name,mime:blob.type||f.type||'application/octet-stream',blob,created:Date.now()});
    request.onerror=()=>reject(request.error||Error('保存できません'));
    t.oncomplete=resolve;t.onerror=()=>reject(t.error||Error('保存できません'));t.onabort=()=>reject(t.error||Error('保存が中断されました'));
   });
   ok++;
  }catch(err){errors.push(f.name+'：'+(err?.message||String(err)))}
  finally{try{d?.close()}catch(_){}}
 }
 try{await refreshReceiptGallery()}catch(err){errors.push('一覧更新：'+err.message)}
 if(ok)alert(ok+'件の領収書を端末内に保存しました。');
 if(errors.length)alert('保存できなかった項目があります。\n'+errors.join('\n'));
}

// 領収書のOCR・確認・合計反映（Ver.2.26）
async function updateReceiptFields(id,fields,verified){
 const d=await receiptDB();try{await new Promise((resolve,reject)=>{
  const tx=d.transaction(RECEIPT_STORE,'readwrite'),st=tx.objectStore(RECEIPT_STORE),req=st.get(id);
  req.onsuccess=()=>{if(!req.result){reject(Error('領収書が見つかりません'));return}st.put({...req.result,...fields,ocrVerified:verified})};
  req.onerror=()=>reject(req.error||Error('領収書を取得できません'));
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('領収書を更新できません'));tx.onabort=()=>reject(tx.error||Error('領収書の更新が中断されました'));
 })}finally{d.close()}
}
async function loadReceiptOCRLibrary(){
 if(window.Tesseract)return window.Tesseract;
 if(!window.__receiptOCRLoading){window.__receiptOCRLoading=new Promise((resolve,reject)=>{
  const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  sc.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(Error('OCRライブラリを読み込めません'));
  sc.onerror=()=>reject(Error('OCRライブラリの取得に失敗しました。インターネット接続をご確認ください'));
  document.head.appendChild(sc);
 }).catch(err=>{window.__receiptOCRLoading=null;throw err})}
 return window.__receiptOCRLoading;
}
function parseReceiptText(raw){
 const amountCandidates=[...raw.matchAll(/(?:合計|総合計|お支払(?:い)?|領収(?:金額)?|税込(?:合計)?|TOTAL)\s*[：:\s￥¥]*([\d,]{2,})/gi)];
 const amountMatch=amountCandidates.at(-1)||[...raw.matchAll(/[￥¥]\s*([\d,]{2,})/g)].at(-1);
 const amount=amountMatch?Number(amountMatch[1].replace(/,/g,'')):'';
 const date=raw.match(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/);
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 return {shop:lines[0]||'',date:date?`${date[1]}-${date[2].padStart(2,'0')}-${date[3].padStart(2,'0')}`:'',amount:Number.isFinite(amount)?amount:'',number:''};
}
async function recognizeReceipt(id){
 const status=document.getElementById('ocr_'+id);if(status)status.textContent='OCRを準備中…';
 let worker;
 try{
  const r=(await getReceipts(event().id)).find(x=>x.id===id);
  if(!r||!r.mime.startsWith('image/'))throw Error('画像の領収書が見つかりません');
  const t=await loadReceiptOCRLibrary();if(status)status.textContent='文字を読み取っています…';
  worker=await t.createWorker('jpn+eng');
  const result=await worker.recognize(r.blob);
  const raw=result?.data?.text||'';
  await updateReceiptFields(id,{ocrRaw:raw,ocrFields:parseReceiptText(raw)},false);

async function collectDataIssues(x,receipts){
 const issues=[],warnings=[],seen={};
 function duplicate(items,name){const s=new Set();for(const v of items){if(!v||typeof v.id!=='string'||!v.id)issues.push(name+'にID未設定があります');else if(s.has(v.id))issues.push(name+'に重複IDがあります: '+v.id);else s.add(v.id)}return s}
 if(!x||!Array.isArray(x.events)||!Array.isArray(x.members)||!Array.isArray(x.venues))return {issues:['データの基本構造が不正です'],warnings:[]};
 const mid=duplicate(x.members,'委員名簿'),vid=duplicate(x.venues,'店舗台帳'),eid=duplicate(x.events,'開催一覧');
 if(!Number.isInteger(Number(x.year))||!Number.isFinite(Number(x.budget))||Number(x.budget)<0)issues.push('年度または予算額が不正です');
 for(const e of x.events){
   const label=(e.year||'?')+'年'+(e.month||'?')+'月 '+(e.type||'会合');
   if(!Number.isInteger(+e.month)||+e.month<1||+e.month>12)issues.push(label+'：開催月が不正です');
   if(e.venueId&&!vid.has(e.venueId))warnings.push(label+'：店舗台帳にない店舗が参照されています');
   if(!Number.isFinite(+e.cost)||+e.cost<0)issues.push(label+'：支払総額が不正です');
   
   for(const id of Object.keys(e.attendees||{}))if(!mid.has(id))warnings.push(label+'：名簿にない参加者IDがあります');
   for(const id of Object.keys(e.fees||{}))if(!mid.has(id))warnings.push(label+'：名簿にない会費設定があります');
   for(const [id,amount] of Object.entries(e.fees||{}))if(!Number.isFinite(+amount)||+amount<0)issues.push(label+'：会費金額が不正です');
   if(e.claimAmount!=null&&Math.abs(Number(e.claimAmount)-Math.max(0,(+e.cost||0)-Object.entries(e.fees||{}).reduce((a,[id,v])=>a+((e.collected||{})[id]?(+v||0):0),0)))>1)warnings.push(label+'：請求額と徴収済会費の差引計算が一致しません');
 }
 if(Array.isArray(receipts)){
   const ids=new Set();
   for(const r of receipts){
     if(ids.has(r.id))issues.push('領収書IDが重複しています');ids.add(r.id);
     if(!eid.has(r.eventId))warnings.push('開催記録のない領収書があります: '+(r.name||r.id));
     if(!(r.blob instanceof Blob)&&!(typeof r.dataUrl==='string'&&r.dataUrl.startsWith('data:')))issues.push('領収書画像データがありません: '+(r.name||r.id));
   }
 }
 return {issues:[...new Set(issues)],warnings:[...new Set(warnings)]};
}

function parseChouseisanPaste(raw){
 const rows=[];
 for(const line of String(raw||'').split(/\r?\n/)){
  const t=line.trim();if(!t)continue;
  if(/^(名前|氏名|参加者|回答者|日程|候補日|コメント|出欠|回答状況)\s*[:：\t]/.test(t))continue;
  let cols=t.split(/\t+/).map(x=>x.trim()).filter(Boolean);
  if(cols.length<2)cols=t.split(/\s{2,}|　{2,}/).map(x=>x.trim()).filter(Boolean);
  let name='',status='';
  const statusToken=x=>/^(?:○|〇|◯|◎|△|×|✕|✖|❌|参加|出席|欠席|不参加|未定|保留|未回答|OK|NG|可|不可)$/i.test(x.trim());
  if(cols.length>=2){
   const first=cols[0].replace(/^\d+[.)．、]\s*/,'');
   if(!first||/^(名前|氏名|参加者)$/.test(first))continue;
   name=first;
   const statuses=cols.slice(1).filter(statusToken);
   status=statuses.length===1?statuses[0]:statuses.length>1?'複数候補':cols[1];
  }else{
   const m=t.match(/^(.+?)\s+(○|〇|◯|◎|△|×|✕|✖|❌|参加|出席|欠席|不参加|未定|保留|未回答|OK|NG)$/i);
   if(m){name=m[1].trim();status=m[2]}else{name=t;status='未回答'}
  }
  if(!name||name.length>80)continue;
  if(/^(名前|氏名|参加者|回答者|合計|コメント|日程調整|出欠表)$/.test(chouseisanNorm(name)))continue;
  rows.push({name,status:chouseisanStatus(status),rawStatus:status});

}
function chouseisanStatus(value){

 showChouseisanMatch(document.getElementById('chouseisanMatch'),d.label);
}
function previewChouseisan(){
 chouseisanCsv=null;
 const info=document.getElementById('chouseisanCsvInfo');if(info)info.textContent='';
 chouseisanRows=parseChouseisanPaste(document.getElementById('chouseisanPaste')?.value);
 const target=document.getElementById('chouseisanPreview');
 showChouseisanMatch(target,'貼り付け');
}
function showChouseisanMatch(target,dateLabel){
 const e=event();if(!e||!target)return;
 if(!chouseisanRows.length){target.innerHTML='<p class="warn">回答を読み取れませんでした。CSVを選択するか、氏名と回答を貼り付けてください。</p>';return}
 const options=db.members.filter(m=>m.active!==false||m.executive);
 const aliases=db.chouseisanAliases||{};
 const used=new Set();
 let html='<p class="muted">対象：'+esc(dateLabel)+'／'+chouseisanRows.length+'名。氏名・出欠を確認してください。未紐づけは反映されません。</p><div class="scroll"><table><thead><tr><th>調整さんの登録名</th><th>委員名簿との紐づけ</th><th>出欠</th></tr></thead><tbody>';
 chouseisanRows.forEach((r,i)=>{
  let id=aliases[chouseisanNorm(r.name)]||'';
  if(!options.some(m=>m.id===id)){
   const matches=options.filter(m=>chouseisanNorm(m.name)===chouseisanNorm(r.name));
   id=matches.length===1?matches[0].id:'';
  }
  if(id&&used.has(id))id='';if(id)used.add(id);
  html+='<tr><td>'+esc(r.name)+'</td><td><select id="chMember_'+i+'"><option value="">-- 紐づけ先を選択 --</option>'+options.map(m=>'<option value="'+esc(m.id)+'" '+(m.id===id?'selected':'')+'>'+esc(m.name)+(m.active===false?'（退任）':'')+'</option>').join('')+'</select></td><td><select id="chStatus_'+i+'">'+['未回答','参加','欠席','未定'].map(v=>'<option '+(v===r.status?'selected':'')+'>'+v+'</option>').join('')+'</select></td></tr>';
 });
 html+='</tbody></table></div><p class="muted">登録名と委員名簿を照合してください。既存の出欠は上書きされます。調整さんの「△」は「未定」として扱います。</p><button class="primary" onclick="applyChouseisan()">確認した出欠を反映・紐づけを保存</button>';
 target.innerHTML=html;
}
function applyChouseisan(){
 const e=event();if(!e||!chouseisanRows.length)return;
 const selectedRows=[];const used=new Set();
 for(let i=0;i<chouseisanRows.length;i++){
  const id=document.getElementById('chMember_'+i)?.value||'';
  const status=document.getElementById('chStatus_'+i)?.value||'未回答';
  if(!id)continue;
  if(used.has(id)){alert('同じ委員に複数の調整さん登録名が紐づいています。重複を解消してください。');return}
  used.add(id);selectedRows.push({id,status,name:chouseisanRows[i].name});
 }
 if(!selectedRows.length){alert('紐づけ先の委員を1名以上選択してください。');return}
 if(!confirm(selectedRows.length+'名の出欠を反映します。既存の出欠は上書きされます。よろしいですか？'))return;
 e.attendees=e.attendees||{};db.chouseisanAliases=db.chouseisanAliases||{};
 for(const r of selectedRows){e.attendees[r.id]=r.status;db.chouseisanAliases[chouseisanNorm(r.name)]=r.id}
 save();chouseisanRows=[];chouseisanCsv=null;render();alert(selectedRows.length+'名の出欠を反映しました。次回から同じ登録名を自動照合します。');
}
</script>
</body></html>
